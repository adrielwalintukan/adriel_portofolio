<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Adriel Walintukan — Developer Portfolio. Full-stack developer crafting modern digital experiences." />
    <meta name="theme-color" content="#07080a" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded async so it doesn't block first paint; the intro loader covers the font swap -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700..900&family=Geist:wght@300..700&family=JetBrains+Mono:wght@400..700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700..900&family=Geist:wght@300..700&family=JetBrains+Mono:wght@400..700&display=swap" /></noscript>

    <!-- Hero portrait is the LCP element; without this it is only discovered after the JS runs -->
    <link rel="preload" as="image" href="/images/adriel.jpg" fetchpriority="high" />

    <title>Adriel Walintukan | Developer Portfolio</title>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
