<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Adriel Walintukan, full-stack and AI developer from Manado, Indonesia. Information Systems student at Klabat University. Projects, experience and skills." />
    <meta name="theme-color" content="#ccd2d6" />
    <link rel="canonical" href="https://adrielportofolio.vercel.app/" />

    <!-- link previews (LinkedIn, WhatsApp, X, Slack); /studio swaps these at build time -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Adriel Walintukan" />
    <meta property="og:title" content="Adriel Walintukan | Developer Portfolio" />
    <meta property="og:description" content="Information Systems student building AI-powered web and mobile products with clean architecture." />
    <meta property="og:url" content="https://adrielportofolio.vercel.app/" />
    <meta property="og:image" content="https://adrielportofolio.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Adriel Walintukan's portfolio: portrait and name on the home page" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adriel Walintukan | Developer Portfolio" />
    <meta name="twitter:description" content="Information Systems student building AI-powered web and mobile products with clean architecture." />
    <meta name="twitter:image" content="https://adrielportofolio.vercel.app/og-image.jpg" />

    <!-- tells search engines who this site is about, so a search for the name can show it as his profile -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://adrielportofolio.vercel.app/#person",
            "name": "Adriel Walintukan",
            "url": "https://adrielportofolio.vercel.app/",
            "image": "https://adrielportofolio.vercel.app/images/adriel.webp",
            "jobTitle": "Full-Stack Developer",
            "description": "Information Systems student building AI-powered web and mobile products with clean architecture.",
            "address": { "@type": "PostalAddress", "addressLocality": "Manado", "addressCountry": "ID" },
            "affiliation": { "@type": "CollegeOrUniversity", "name": "Klabat University" },
            "knowsAbout": ["AI Integration", "Web Development", "Mobile App Development", "Python", "Software Testing"],
            "sameAs": [
              "https://github.com/AdrielWalintukan",
              "https://www.linkedin.com/in/adriel-walintukan-383032332/",
              "https://www.instagram.com/walintukann.adriel/"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://adrielportofolio.vercel.app/#website",
            "url": "https://adrielportofolio.vercel.app/",
            "name": "Adriel Walintukan",
            "publisher": { "@id": "https://adrielportofolio.vercel.app/#person" }
          },
          {
            "@type": "ProfilePage",
            "url": "https://adrielportofolio.vercel.app/",
            "name": "Adriel Walintukan | Developer Portfolio",
            "mainEntity": { "@id": "https://adrielportofolio.vercel.app/#person" }
          }
        ]
      }
    </script>

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded async so it doesn't block first paint; the intro loader covers the font swap -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700..900&family=Geist:wght@300..700&family=JetBrains+Mono:wght@400..700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700..900&family=Geist:wght@300..700&family=JetBrains+Mono:wght@400..700&display=swap" /></noscript>

    <!-- Hero portrait is the LCP element; without this it is only discovered after the JS runs -->

    <title>Adriel Walintukan | Developer Portfolio</title>
    <link rel="preload" as="image" href="/images/hero-body.webp" fetchpriority="high" />
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
